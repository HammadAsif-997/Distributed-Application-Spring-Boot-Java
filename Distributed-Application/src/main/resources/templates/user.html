<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Boot Application</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 p-8 font-sans">

  <!-- Main Container -->
  <div class="max-w-4xl mx-auto space-y-8">
    <h1 class="text-4xl font-semibold text-center text-gray-800">Distributed Application</h1>

    <!-- User Management Section -->
    <div class="bg-white shadow-lg rounded-lg p-6 space-y-6">
      <h2 class="text-2xl font-semibold text-gray-700">User Management</h2>

      <div class="flex justify-between items-center">
      <a href="/"><button class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md">Back</button></a>
        <button id="addUserBtn" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md">Add User</button>
      </div>

      <table id="userTable" class="table-auto w-full mt-6 text-gray-700 border-separate border-spacing-2">
        <thead>
          <tr class="bg-gray-100">
            <th class="px-4 py-2 text-left font-medium">ID</th>
            <th class="px-4 py-2 text-left font-medium">Username</th>
            <th class="px-4 py-2 text-left font-medium">Email</th>
            <th class="px-4 py-2 text-left font-medium">Role</th>
            <th class="px-4 py-2 text-left font-medium">Active</th>
            <th class="px-4 py-2 text-left font-medium">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Add User Form -->
      <div id="addUserForm" class="mt-8 hidden space-y-4">
        <h3 class="text-xl font-semibold text-gray-700">Add / Edit User</h3>
        <form id="userForm" class="space-y-4">
          <input type="hidden" id="userId">
          <div class="flex flex-col">
            <label for="username" class="text-gray-600">Username</label>
            <input type="text" id="username" name="username" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <div class="flex flex-col">
            <label for="email" class="text-gray-600">Email</label>
            <input type="email" id="email" name="email" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <div class="flex flex-col">
            <label for="role" class="text-gray-600">Role</label>
            <input type="text" id="role" name="role" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <div class="flex items-center">
            <label for="active" class="text-gray-600 mr-2">Active</label>
            <input type="checkbox" id="active" name="active" class="border rounded-md">
          </div>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md">Save User</button>
        </form>
      </div>
    </div>
  </div>

  <script>
  // Function to fetch and display users
  async function fetchUsers() {
    const response = await fetch("/users");
    const users = await response.json();
  
    const userTable = document.getElementById('userTable').getElementsByTagName('tbody')[0];
    userTable.innerHTML = ''; // Clear existing table rows
  
    users.forEach(user => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="px-4 py-2 border-b">${user.id}</td>
        <td class="px-4 py-2 border-b">${user.username}</td>
        <td class="px-4 py-2 border-b">${user.email}</td>
        <td class="px-4 py-2 border-b">${user.role}</td>
        <td class="px-4 py-2 border-b">${user.active ? 'Yes' : 'No'}</td>
        <td class="px-4 py-2 border-b">
          <button class="bg-yellow-500 text-white px-2 py-1 rounded" onclick="editUser(${user.id})">Edit</button>
          <button class="bg-red-500 text-white px-2 py-1 rounded" onclick="deleteUser(${user.id})">Delete</button>
        </td>
      `;
      userTable.appendChild(row);
    });
  }

  // Fetch users when the page loads
  window.addEventListener('DOMContentLoaded', fetchUsers);

  // Edit User
  function editUser(id) {
    fetch(`/users/${id}`)
      .then(res => res.json())
      .then(user => {
        if (user) {
          document.getElementById('userId').value = user.id;
          document.getElementById('username').value = user.username;
          document.getElementById('email').value = user.email;
          document.getElementById('role').value = user.role;
          document.getElementById('active').checked = user.active;

          document.getElementById('addUserForm').classList.remove('hidden');
        } else {
          console.error("User not found");
        }
      })
      .catch(err => console.error("Error fetching user:", err));
  }

  // Delete User
  async function deleteUser(id) {
    const response = await fetch(`/users/${id}`, { method: 'DELETE' });
    if (response.ok) {
      fetchUsers(); // Reload the table dynamically
    } else {
      console.error("Failed to delete user");
    }
  }

  // User Form Submit (Create or Edit)
  document.getElementById('userForm').addEventListener('submit', async (event) => {
    event.preventDefault();
  
    const userId = document.getElementById('userId').value;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const role = document.getElementById('role').value;
    const active = document.getElementById('active').checked;
  
    let response;
    if (userId) {
      response = await fetch(`/users/${userId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, role, active })
      });
    } else {
      response = await fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, role, active })
      });
    }
  
    if (response.ok) {
      document.getElementById('userId').value = '';
      document.getElementById('addUserForm').classList.add('hidden');
      document.getElementById('userForm').reset();
      fetchUsers(); // Refresh the user list dynamically
    } else {
      console.error("Failed to save user");
    }
  });

  // Add User Button
  document.getElementById('addUserBtn').addEventListener('click', () => {
    document.getElementById('userForm').reset(); // Clear form fields
    document.getElementById('userId').value = '';  
    document.getElementById('addUserForm').classList.remove('hidden'); // Show the form
  });



  </script>

</body>
</html>
