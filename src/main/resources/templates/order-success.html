<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Success</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-5 text-center">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <h1 class="text-success mb-4">🎉 Order Successful!</h1>
                <p class="lead">Thank you for your purchase.</p>

                <div class="alert alert-info mt-4">
                    <h4>Order Details</h4>
                    <p><strong>Total Price:</strong> <span th:text="${order.totalPrice}"></span> USD</p>
                    <p><strong>User ID:</strong> <span th:text="${order.userId}"></span></p>
                </div>

                <div class="mt-4">
                    <a href="/products/catalog" class="btn btn-primary">Continue Shopping</a>
                    <!-- <a href="/orders" class="btn btn-secondary">View Order History</a> -->
                </div>
            </div>
        </div>

        <footer class="mt-5 text-muted">
            <p>&copy; 2025 My Webshop. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
