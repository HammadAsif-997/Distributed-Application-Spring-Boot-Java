<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center">

<!-- Header -->
<header class="w-full bg-blue-600 text-white py-6 shadow">
  <h1 class="text-center text-3xl font-bold">Shopping Cart</h1>
</header>

<!-- Shopping Cart Table -->
<div class="container mx-auto mt-10 bg-white rounded-lg shadow-lg p-3">
  <span style="font-weight: 500; ">Convert to:</span> 
  <a href="/cart/dollar" style="margin-right: 10px;" class="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600">
    Dollar
  </a>
  <a href="/cart/eur" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600">
    Euro
  </a>

  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Your Items</h2>
  <table class="table-auto w-full border-collapse border border-gray-300">
    <thead>
      <tr class="bg-gray-200 text-left text-gray-600">
        <th class="px-4 py-2 border border-gray-300">Product Name</th>
        <th class="px-4 py-2 border border-gray-300">Quantity</th>
        <th class="px-4 py-2 border border-gray-300">Price</th>
        <th class="px-4 py-2 border border-gray-300">Total</th>
        <th class="px-4 py-2 border border-gray-300">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="entry : ${cart.products.entrySet()}" class="hover:bg-gray-100">
        <td class="px-4 py-2 border border-gray-300" th:text="${entry.key.name}"></td>
        <td class="px-4 py-2 border border-gray-300 text-center" th:text="${entry.value}"></td>
        <td class="px-4 py-2 border border-gray-300 text-right" th:text="${entry.key.price} + ' ' + ${cart.currency}"></td>
        <td class="px-4 py-2 border border-gray-300 text-right" th:text="${entry.key.price * entry.value} + ' ' + ${cart.currency}"></td>
        <td class="px-4 py-2 border border-gray-300 text-center">
          <a th:href="@{/cart-remove/{id}(id=${entry.key.id})}" 
             class="text-red-500 hover:underline">Remove</a>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Total Section -->
   
  <div class="mt-6 text-right">
    <h3 class="text-xl font-bold text-gray-800">Original Price: 
      <span class="text-blue-600" th:text="${cart.originalTotalPrice} + ' ' + ${cart.currency}"></span>
    </h3>
    
    <h3 class="text-xl font-bold text-gray-800">Total:
       <span  class="text-blue-600"th:text="${cart.discountedTotalPrice}  + ' ' + ${cart.currency}"> </span></h3>
    <h3 th:if="${cart.voucherApplied}">Savings: <span th:text="${cart.originalTotalPrice.subtract(cart.discountedTotalPrice)}  + ' ' + ${cart.currency}"></span></h3>
    <div th:if="${!cart.voucherApplied}">
      <a th:href="@{/cart/voucher}" style="color: orange;">Apply 10% Voucher</a>
    </div>
    <div th:if="${cart.voucherApplied}">
        <a th:href="@{/cart/removevoucher}" style="color: red;">Remove Voucher</a>
    </div>
    <form action="/checkout" method="post">
        <input type="hidden" name="totalPrice" th:value="${cart.discountedTotalPrice}">
        <button  class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600" type="submit">Pay Now</button>
    </form>
  
  </div>

  <!-- Buttons -->
  <div class="mt-6 flex justify-between">
    <a href="/products/catalog" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
      Continue Shopping
    </a>
    <!-- <a href="/checkout" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600">
      Proceed to Checkout
    </a> -->
  </div>
</div>

</body>
</html>
