<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Boot Application</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 p-8 font-sans">

  <!-- Main Container -->
  <div class="max-w-4xl mx-auto space-y-8">
    <h1 class="text-4xl font-semibold text-center text-gray-800">Distributed Application</h1>

    <!-- Product Management Section -->
    <div class="bg-white shadow-lg rounded-lg p-6 space-y-6">
      <h2 class="text-2xl font-semibold text-gray-700">Product Management</h2>
      <div class="flex space-x-4 mb-4">
        
        <a href="/products" class="text-white py-2 px-4 rounded-md" style="
        background: black; ">All</a>
        <a href="/products/color/brown" class="text-white py-2 px-4 rounded-md" style="
        background: brown; ">Brown</a>
        <a href="/products/color/red" class="bg-red-500 text-white py-2 px-4 rounded-md">Red</a>
        <a href="/products/color/blue" class="bg-blue-500 text-white py-2 px-4 rounded-md">Blue</a>
        <a href="/products/color/green" class="bg-green-500 text-white py-2 px-4 rounded-md">Green</a>
        <a href="/products/catalog-paginated" class="bg-black-500 text-white py-2 px-4 rounded-md" style="
        background: grey; ">Pagination</a>
      </div>
      
      
      <form action="/products" method="get" class="flex space-x-2 mb-4">
        <input type="text" name="name" placeholder="Search for products by name..." class="border rounded-md px-3 py-2 flex-grow">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md"> Search </button>
      </form>
      
      <div class="flex justify-between items-center">
        <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md">Back</a>
        <button id="addProductBtn" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md">Add Product</button>
      </div>

      <table id="productTable" class="table-auto w-full mt-6 text-gray-700 border-separate border-spacing-2">
        <thead>
          <tr class="bg-gray-100">
            <th class="px-4 py-2 text-left font-medium">ID</th>
            <th class="px-4 py-2 text-left font-medium">Name</th>
            <th class="px-4 py-2 text-left font-medium">Color</th>
            <th class="px-4 py-2 text-left font-medium">Size</th>
            <th class="px-4 py-2 text-left font-medium">Price</th>
            <th class="px-4 py-2 text-left font-medium">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="product : ${products}">
            <td class="px-4 py-2 border-b" th:text="${product.id}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.name}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.color}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.size}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.price} +' EUR'"></td>
            <td class="px-4 py-2 border-b">
                <button class="bg-yellow-500 text-white px-2 py-1 rounded" th:onclick="'editProduct(' + ${product.id} + ')'">Edit</button>
                <a th:href="@{/product/{id}(id=${product.id})}" class="bg-blue-500 text-white px-2 py-1 rounded">View</a>
              <button class="bg-red-500 text-white px-2 py-1 rounded" th:onclick="'deleteProduct(' + ${product.id} + ')'">Delete</button>
           </td>
          </tr>
        </tbody>
      </table>

      <!-- Add/Edit Product Form -->
      <div id="addProductForm" class="mt-8 hidden space-y-4">
        <h3 class="text-xl font-semibold text-gray-700">Add/Edit Product</h3>
        <form id="productForm" class="space-y-4">
          <input type="hidden" id="productId">
          <div class="flex flex-col">
            <label for="productName" class="text-gray-600">Product Name</label>
            <input type="text" id="productName" name="name" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <div class="flex flex-col">
            <label for="productColor" class="text-gray-600">Color</label>
            <input type="text" id="productColor" name="color" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <div class="flex flex-col">
            <label for="productSize" class="text-gray-600">Size</label>
            <input type="text" id="productSize" name="size" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <div class="flex flex-col">
            <label for="productPrice" class="text-gray-600">Price</label>
            <input type="number" step="0.01" id="productPrice" name="price" class="border rounded-md px-3 py-2 mt-1" required>
          </div>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md">Save Product</button>
        </form>
      </div>
    </div>
  </div>

    // Edit Product Function
    function editProduct(id) {
      fetch(`/products/${id}`)
        .then(res => res.json())
        .then(product => {
          if (product) {
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productColor').value = product.color;
            document.getElementById('productSize').value = product.size;

            const price = product.price && !isNaN(product.price) ? product.price.toFixed(2) : '0.00';
            document.getElementById('productPrice').value = price;

            document.getElementById('addProductForm').classList.remove('hidden');
          } else {
            console.error("Product not found");
          }
        })
        .catch(err => {
          console.error("Error fetching product:", err);
        });
    }

    // Delete Product
    async function deleteProduct(id) {
      const response = await fetch(`/products/${id}`, {
        method: 'DELETE'
      });
   
      window.location.reload(); // Reload the page to refresh the product list
      
    }
    

    // Product Form Submit (Create or Edit)
    document.getElementById('productForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const productId = document.getElementById('productId').value;
      const name = document.getElementById('productName').value;
      const color = document.getElementById('productColor').value;
      const size = document.getElementById('productSize').value;
      const price = parseFloat(document.getElementById('productPrice').value);

      let response;

      if (productId) {
        response = await fetch(`/products/${productId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color, size, price })
        });
      } else {
        response = await fetch('/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color, size, price })
        });
      }

      const result = await response.json();

      document.getElementById('productId').value = '';
      document.getElementById('addProductForm').classList.add('hidden');
      document.getElementById('productForm').reset();
      window.location.reload();
    });

    // Add Product Button (Show the form)
    document.getElementById('addProductBtn').addEventListener('click', () => {
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('addProductForm').classList.remove('hidden');
    });
  </script>
